name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login == 'dependabot[bot]' &&
       github.event.pull_request.base.ref == 'main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for eligible Dependabot pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" |
            jq -c --arg repo "$REPOSITORY" '
              .[] | select(
                .user.login == "dependabot[bot]" and
                .base.ref == "main" and
                .head.repo.full_name == $repo and
                .draft == false
              )
            ' > "$RUNNER_TEMP/dependabot-prs.jsonl"

          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            head="$(jq -r '.head.sha' <<< "$pr")"

            if [[ "$EVENT_NAME" == "pull_request_target" && "$number" != "$EVENT_PR" ]]; then
              continue
            fi

            if [[ "$(jq -r '.auto_merge != null' <<< "$pr")" == "true" ]]; then
              continue
            fi

            if gh pr merge "$number" --repo "$REPOSITORY" --squash --auto --match-head-commit "$head"; then
              echo "Auto-merge enabled for pull request #$number"
            else
              echo "::warning::Could not enable auto-merge for pull request #$number"
            fi
          done < "$RUNNER_TEMP/dependabot-prs.jsonl"
