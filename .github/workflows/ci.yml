name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Detect changes requiring verification
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          paths_known=false
          changed_paths=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if changed_paths="$(gh api --paginate --jq '.[] | .filename, (.previous_filename // empty)' "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"; then
              paths_known=true
              if [[ "$(printf '%s\n' "$changed_paths" | wc -l)" -ge 3000 ]]; then
                paths_known=false
              fi
            fi
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            if comparison="$(gh api "repos/$REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA")"; then
              if [[ "$(jq '.files | length' <<< "$comparison")" -lt 300 ]]; then
                changed_paths="$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$comparison")"
                paths_known=true
              fi
            fi
          fi

          run_checks=true
          if [[ "$paths_known" == true ]]; then
            run_checks=false
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                README.md|LICENSE|docs/*|.github/dependabot.yml|.github/workflows/dependabot-auto-merge.yml|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                  ;;
                *)
                  echo "Verification required by: $path"
                  run_checks=true
                  break
                  ;;
              esac
            done <<< "$changed_paths"
          else
            echo "Change details unavailable or manually dispatched; running all checks."
          fi

          echo "run=$run_checks" >> "$GITHUB_OUTPUT"
          if [[ "$run_checks" == false ]]; then
            echo "Documentation or repository maintenance only; skipping install, tests, and build."
          fi

      - uses: actions/checkout@v7
        if: steps.changes.outputs.run == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.run == 'true'
      - run: bun install
        if: steps.changes.outputs.run == 'true'
      - run: bun test
        if: steps.changes.outputs.run == 'true'
      - run: bun run build
        if: steps.changes.outputs.run == 'true'
