<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b101a" />
    <meta name="description" content="RFC-oriented HTTP inspection and testing on Cloudflare Workers, with an interactive multilingual playground." />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("httpbin-theme");
        } catch {
          preference = null;
        }
        const theme = preference === "dark" || preference === "light"
          ? preference
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0b101a" : "#f4f7fb");
      })();
    </script>
    <title>HTTPBin — HTTP Request & Response Playground</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
